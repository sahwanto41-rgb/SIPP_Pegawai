var DBT={
  Akun:{k:['u'],h:['u','h','role','name']},
  GTK:{k:['nip'],h:['nip','name','nuptk','jenis','jab','st','gol','tugas','jk','tmp','tgl','pend','tmt','hp','alamat','active','dev']},
  Pengaturan:{k:['k'],h:['k','v']},

function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}
function tbl(n){
  var ss=SpreadsheetApp.getActiveSpreadsheet(),sh=ss.getSheetByName(n),h=DBT[n].h;
  if(!sh){sh=ss.insertSheet(n);sh.getRange(1,1,sh.getMaxRows(),h.length).setNumberFormat('@');
    sh.appendRow(h);sh.getRange(1,1,1,h.length).setFontWeight('bold').setBackground('#1e3a8a').setFontColor('#ffffff');sh.setFrozenRows(1);}
  return sh;}
function rd(n){
  var v=tbl(n).getDataRange().getValues(),h=DBT[n].h,r=[];
  for(var i=1;i<v.length;i++){var o={};h.forEach(function(c,j){o[c]=String(v[i][j]);});r.push(o);}
  return r;}
function wr(n,rows,mode){
  var sh=tbl(n),H=DBT[n].h,K=DBT[n].k,w=H.length,data=[],idx={};
  var key=function(o){return K.map(function(c){return String(o[c]==null?'':o[c]);}).join('|');};
  var old=sh.getLastRow()-1;
  if(mode!='replace'&&old>0){
    data=sh.getRange(2,1,old,w).getValues().map(function(r){return r.map(function(x){return String(x);});});
    data.forEach(function(r,i){var o={};H.forEach(function(c,j){o[c]=r[j];});idx[key(o)]=i;});}
  rows.forEach(function(o){
    var v=H.map(function(c){return o[c]==null?'':String(o[c]);}),k=key(o);
    if(idx[k]!=null)data[idx[k]]=v;else{idx[k]=data.length;data.push(v);}});
  if(data.length){
    if(sh.getMaxRows()<data.length+1)sh.insertRowsAfter(sh.getMaxRows(),data.length+1-sh.getMaxRows());
    var rg=sh.getRange(2,1,data.length,w);rg.setNumberFormat('@');rg.setValues(data);}
  if(old>data.length)sh.getRange(2+data.length,1,old-data.length,w).clearContent();}
function pull(me){
  var adm=me.role=='ADMIN'||me.role=='OPERATOR',stf=adm||me.role=='KEPALA SEKOLAH',o={};
  ['Akun','GTK','Pengaturan','Presensi','PengajuanIzin'].forEach(function(n){
    var r=rd(n);
    if(n=='Akun'&&!adm)r=r.filter(function(x){return x.u==me.u;});
    if(!stf&&(n=='GTK'||n=='Presensi'||n=='PengajuanIzin'))r=r.filter(function(x){return x.nip==me.u;});
    o[n]=r;});
  return o;}
function push(me,d){
  var t=d.t,rows=d.rows||[],mode=d.mode||'upsert',adm=me.role=='ADMIN'||me.role=='OPERATOR',stf=adm||me.role=='KEPALA SEKOLAH';
  if(!DBT[t])return {err:'tabel'};
  if(t=='Akun'&&mode=='replace'&&!rows.length)return {err:'daftar akun kosong ditolak'};
  if(t=='Akun'){
    var cur=rd('Akun'),old={};cur.forEach(function(r){old[r.u]=r;});
    var fixH=function(r){var o=old[r.u];if(o&&r.rst!='1')r.h=o.h;return r;};
    if(me.role=='OPERATOR'){
      // operator hanya boleh menambah/mengubah akun PEGAWAI; akun ADMIN/KEPALA SEKOLAH/OPERATOR (termasuk miliknya) tidak bisa diubah lewat push
      rows=rows.filter(function(r){return r.role=='PEGAWAI'&&(!old[r.u]||old[r.u].role=='PEGAWAI');}).map(fixH);
      mode='upsert';}
    else if(me.role=='ADMIN'){
      rows=rows.map(fixH);
      if(mode=='replace'){
        var have={};rows.forEach(function(r){have[r.u]=1;});
        cur.forEach(function(r){if(r.role=='PEGAWAI'&&!have[r.u]){rows.push(r);have[r.u]=1;}});
        if(!rows.some(function(r){return r.role=='ADMIN';}))return {err:'harus ada minimal satu akun ADMIN'};}}
    else{rows=[];mode='upsert';}}
  else if((t=='GTK'||t=='Pengaturan')&&!adm){
    if(t=='GTK'&&me.role=='PEGAWAI'){
      var ex=null;rd('GTK').forEach(function(r){if(r.nip==me.u)ex=r;});
      var p=rows.filter(function(r){return r.nip==me.u;})[0];
      if(ex&&p&&(!ex.dev||ex.dev=='RESET'||ex.dev==p.dev)){ex.dev=p.dev;rows=[ex];}else rows=[];
      mode='upsert';}
    else rows=[];}
  else if(t=='GTK'&&adm&&mode=='replace'){
    var cur={};rd('GTK').forEach(function(r){cur[r.nip]=r.dev;});
    rows.forEach(function(r){if(r.dev!='RESET'&&cur[r.nip])r.dev=cur[r.nip];});}
  else if(!stf){
    mode='upsert';rows=rows.filter(function(r){return r.nip==me.u;});

const ve0=vEmp;vEmp=function(){ve0();$('#mn h2').insertAdjacentHTML('afterend',`<div class="card"><h3>🔄 Sinkronisasi Data GTK</h3><div class="syst" style="font-size:13px;line-height:1.7;margin-bottom:10px">${syncText()}</div><div class="row bt"><button class="btn g" onclick="doKirim()">⬆ Kirim ke Sheets</button><button class="btn o" onclick="doAmbil()">⬇ Ambil dari Sheets</button></div><p style="font-size:12px;color:var(--mu);margin:10px 0 0"><b>Kirim</b> mengunggah data perangkat ini. <b>Ambil</b> mengunduh data terbaru dari Sheets, dipakai saat aplikasi dibuka di perangkat lain. Perubahan juga terkirim otomatis beberapa detik setelah disimpan.</p></div>`)};

init();
</script></body></html>
